# ── crm.miduva.com ────────────────────────────────────────────────────────────
# HTTP: redirect to HTTPS + serve Let's Encrypt challenge
server {
    listen 80;
    server_name crm.miduva.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to Perfex CRM container
server {
    listen 443 ssl;
    server_name crm.miduva.com;

    ssl_certificate     /etc/letsencrypt/live/crm.miduva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.miduva.com/privkey.pem;

    # Allow large file uploads inside Perfex
    client_max_body_size 50M;

    location / {
        proxy_pass       http://perfex:80;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
