# ── miduva.com ────────────────────────────────────────────────────────────────
# HTTP: redirect to HTTPS + serve Let's Encrypt challenge
server {
    listen 80 default_server;
    server_name miduva.com www.miduva.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to Next.js container
server {
    listen 443 ssl;
    server_name miduva.com www.miduva.com;

    ssl_certificate     /etc/letsencrypt/live/miduva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miduva.com/privkey.pem;

    # Allow large image uploads to Payload admin
    client_max_body_size 50M;

    location / {
        proxy_pass         http://nextjs:3000;
        proxy_http_version 1.1;

        # WebSocket support (used by Next.js HMR in dev; harmless in prod)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
