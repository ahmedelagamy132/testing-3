# ── miduva.com ────────────────────────────────────────────────────────────────
# Throttle WordPress login attempts per client IP.
limit_req_zone $binary_remote_addr zone=wp_login:10m rate=10r/m;

# HTTP: redirect to HTTPS + serve Let's Encrypt challenge
server {
    listen 80 default_server;
    server_name miduva.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: proxy to Next.js container
server {
    listen 443 ssl;
    server_name miduva.com;

    ssl_certificate     /etc/letsencrypt/live/miduva.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miduva.com/privkey.pem;

    # Leave room for multipart headers around the editor's 10 MB image limit.
    client_max_body_size 11M;

    # ── WordPress (headless CMS): admin, REST API, media ──────────────────
    # The public blog at /blog is rendered by Next.js; only these paths
    # reach WordPress.
    location = /xmlrpc.php { return 403; }

    location ~ ^/wp-login\.php$ {
        limit_req zone=wp_login burst=5 nodelay;
        client_max_body_size 1M;
        proxy_pass         http://wordpress;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/(wp-admin|wp-includes|wp-content|wp-json)(/|$)|^/wp-cron\.php$ {
        client_max_body_size 34M;
        proxy_pass         http://wordpress;
        proxy_read_timeout 120s;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://nextjs:3000;
        proxy_http_version 1.1;

        # WebSocket support (used by Next.js HMR in dev; harmless in prod)
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection 'upgrade';

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
