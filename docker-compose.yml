services:

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    # Pick up certificates renewed by the certbot sidecar without restarting
    # the reverse proxy. Nginx reads certificate files when it reloads.
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h & wait $${!}
          nginx -s reload
        done &
        exec nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - nextjs
      - perfex
      - wordpress
    networks:
      - app
    restart: unless-stopped

  # ── TLS certificate renewal ────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    entrypoint: /bin/sh
    command:
      - -c
      - |
        trap exit TERM
        while :; do
          certbot renew --webroot -w /var/www/certbot --no-random-sleep-on-renew
          sleep 12h & wait $${!}
        done
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    networks:
      - app
    restart: unless-stopped

  # ── Next.js app ────────────────────────────────────────────────────────────
  nextjs:
    build:
      context: ./miduva-app
    environment:
      - NODE_ENV=production
      - MIDUVA_DATABASE_URI=file:/data/miduva.db
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL:-}
      - CONTACT_NOTIFICATION_EMAIL=${CONTACT_NOTIFICATION_EMAIL:-hello@miduva.com}
      - CONTACT_WEBHOOK_URL=${CONTACT_WEBHOOK_URL:-}
      - CONTACT_WEBHOOK_SECRET=${CONTACT_WEBHOOK_SECRET:-}
      - PUCK_ADMIN_PASSWORD=${PUCK_ADMIN_PASSWORD:?PUCK_ADMIN_PASSWORD is required}
      - PUCK_SESSION_SECRET=${PUCK_SESSION_SECRET:?PUCK_SESSION_SECRET is required}
      - PUCK_MEDIA_DIR=/data/puck-media
      - SITE_URL=${SITE_URL:-https://miduva.com}
      - GA_MEASUREMENT_ID=${GA_MEASUREMENT_ID:-}
      - META_PIXEL_ID=${META_PIXEL_ID:-}
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - WORDPRESS_API_URL=http://wordpress/wp-json
      - WP_REVALIDATE_SECRET=${WP_REVALIDATE_SECRET:-}
    volumes:
      - miduva_data:/data              # persists submissions, Puck content, and media
    networks:
      - app
    restart: unless-stopped

  # ── Perfex CRM (PHP 8.1 + Apache) ────────────────────────────────────────
  perfex:
    build:
      context: ./perfex
    volumes:
      - ./perfex/html:/var/www/html    # bind mount — easy to update without rebuild
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  # ── MySQL (Perfex database only) ──────────────────────────────────────────
  # ── WordPress (headless blog CMS) ──────────────────────────────────────────
  # Editors use miduva.com/wp-admin; nginx routes only WordPress paths here.
  # The public /blog pages are rendered by Next.js from the REST API.
  wordpress:
    image: wordpress:6-php8.3-apache
    environment:
      - WORDPRESS_DB_HOST=mysql
      - WORDPRESS_DB_NAME=wordpress
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASSWORD:?WP_DB_PASSWORD is required}
      - WP_REVALIDATE_SECRET=${WP_REVALIDATE_SECRET:-}
      - |
        WORDPRESS_CONFIG_EXTRA=
        define('WP_HOME', 'https://miduva.com');
        define('WP_SITEURL', 'https://miduva.com');
        if (($$_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') { $$_SERVER['HTTPS'] = 'on'; }
        define('FORCE_SSL_ADMIN', true);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_POST_REVISIONS', 20);
        define('AUTOMATIC_UPDATER_DISABLED', false);
        define('WP_AUTO_UPDATE_CORE', 'minor');
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wordpress/php.ini:/usr/local/etc/php/conf.d/miduva.ini:ro
    depends_on:
      - mysql
    networks:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=perfex
      - MYSQL_USER=perfex
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  miduva_data:     # Next.js SQLite database and Puck media
  mysql_data:      # Perfex + WordPress MySQL data
  wp_data:         # WordPress core, plugins and uploaded media
  certbot_www:     # Let's Encrypt ACME challenge webroot
  certbot_conf:    # Let's Encrypt certificates

# ── Network ───────────────────────────────────────────────────────────────────
networks:
  app:
    driver: bridge
